spring:
  application:
    name: permission-service
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0: https://<tenant>.auth0.com/ (con la barra final)
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/permission}
    username: ${DB_USER:permission}
    password: ${DB_PASSWORD:permission}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
